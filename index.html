<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Docs</title>
  <meta name="description" content="Unofficial, community-maintained API references.">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #09090b;
      --muted: #71717a;
      --border: #e4e4e7;
      --card: #fafafa;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b;
        --fg: #fafafa;
        --muted: #a1a1aa;
        --border: #27272a;
        --card: #18181b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 640px; margin: 0 auto; padding: 64px 16px; }
    h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 4px; }
    p.lede { color: var(--muted); margin: 0 0 32px; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
    a.card {
      display: block;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: inherit;
      text-decoration: none;
    }
    a.card:hover { border-color: var(--muted); }
    a.card strong { display: block; font-weight: 600; }
    a.card span { color: var(--muted); font-size: 14px; }
    footer { margin-top: 48px; color: var(--muted); font-size: 13px; }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Docs</h1>
    <p class="lede">Unofficial, community-maintained API references.</p>
    <ul>
      <li>
        <a class="card" href="fieldroutes/">
          <strong>FieldRoutes API</strong>
          <span>Corrected OpenAPI spec, with a reference you can read and try against your own tenant.</span>
        </a>
      </li>
    </ul>
    <footer>
      Found something wrong? <a href="https://github.com/alecbolingbroke/docs/issues">Open an issue</a>.
    </footer>
  </main>
</body>
</html>
