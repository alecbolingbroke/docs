name: Deploy Pages

# Replaces the deprecated legacy "deploy from a branch" Pages build.
# Publishes every project folder on push to main (and on demand):
#   index.html     -> /docs/             (the project index)
#   fieldroutes/   -> /docs/fieldroutes/
# Add a project: create its folder, add it to the cp line below and to index.html.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Stage site
        run: mkdir -p _site && cp index.html _site/ && cp -r fieldroutes _site/fieldroutes

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
