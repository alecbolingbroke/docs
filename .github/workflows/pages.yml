name: Deploy Pages

# Replaces the deprecated legacy "deploy from a branch" Pages build.
# Publishes docs/ on every push to main (and on demand), preserving the
# /fieldroutes-docs/docs/ URL path.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Stage site (keep the /docs/ URL path)
        run: mkdir -p _site && cp -r docs _site/docs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
